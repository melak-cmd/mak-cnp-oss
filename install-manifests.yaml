apiVersion: v1
kind: Namespace
metadata:
  name: cnp-install
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnp-installer
  namespace: cnp-install
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnp-installer-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: cnp-installer
    namespace: cnp-install