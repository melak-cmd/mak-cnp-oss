eso:
  providerUrl: "http://sx-vault-active.vault.svc.cluster.local:8200"
  backendName: vault-backend
  secretStore: sx-cnp-oss-kv
  # oidc config
  oidcDiscoveryUrl: https://keycloak-127-0-0-1.nip.io/realms/sx-cnp-oss
  callbackUri: "https://vault-127-0-0-1.nip.io"
  # Copyright (c) HashiCorp, Inc.
  # SPDX-License-Identifier: MPL-2.0
vault:
  injector:
    enabled: false
  server:
    ingress:
      enabled: true
      hosts:
        - host: vault-127-0-0-1.nip.io
          paths: []
      tls:
        - secretName: vault-server-tls
          hosts:
            - vault-127-0-0-1.nip.io
    extraInitContainers:
      - name: utility-downloader
        image: alpine/curl:latest
        command:
          - /bin/sh
          - -c
          - "cd /usr/local/libexec/vault\nexport PLUGIN_VERSION=v2.1.0\ncurl -L -o vault-plugin-secrets-github-linux-amd64 https://github.com/martinbaillie/vault-plugin-secrets-github/releases/download/${PLUGIN_VERSION}/vault-plugin-secrets-github-linux-amd64 \nchmod +x vault-plugin-secrets-github-linux-amd64\ncurl -LO \"https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl\"\nchmod +x kubectl\ncurl -L -o jq https://github.com/stedolan/jq/releases/download/jq-1.7.1/jq-linux64\nchmod +x jq\ncurl -L -o curl https://github.com/moparisthebest/static-curl/releases/download/v8.7.1/curl-amd64\nchmod +x curl\n"
        volumeMounts:
          - name: plugins
            mountPath: /usr/local/libexec/vault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true
    extraContainers:
      - name: auto-initializer
        image: hashicorp/vault:1.17.2
        env:
          - name: VAULT_ADDR
            valueFrom:
              secretKeyRef:
                name: sx-vault-env-vars
                key: VAULT_ADDR
        command:
          - /bin/sh
          - -c
          - "while true; do\n  sleep 10\n  while [ -z $UNSEAL_KEY ]; do\n    sleep 5\n    VAULT_STATUS=$(vault status)\n    if echo \"$VAULT_STATUS\" | grep -q \"Initialized.*false\" && [ $HOSTNAME = 'sx-vault-0' ]; then\n      export INIT_RESPONSE=$(vault operator init -format=json -key-shares=1 -key-threshold=1)\n      echo \"$INIT_RESPONSE\"\n      export UNSEAL_KEY=$(echo \"$INIT_RESPONSE\" | /usr/local/libexec/vault/jq -r .unseal_keys_b64[0])\n      export ROOT_TOKEN=$(echo \"$INIT_RESPONSE\" | /usr/local/libexec/vault/jq -r .root_token)\n      echo \"$UNSEAL_KEY\"\n      echo \"$ROOT_TOKEN\"\n      /usr/local/libexec/vault/kubectl delete secret vault-init -n vault\n      /usr/local/libexec/vault/kubectl create secret generic vault-init -n vault --from-literal=unseal_key=${UNSEAL_KEY} --from-literal=root_token=${ROOT_TOKEN} \n    else\n      echo \"Vault Initialized\"\n    fi \n  done   \ndone\n"
        volumeMounts:
          - name: plugins
            mountPath: /usr/local/libexec/vault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true
      - name: auto-unsealer
        image: hashicorp/vault:1.17.2
        env:
          - name: VAULT_ADDR
            valueFrom:
              secretKeyRef:
                name: sx-vault-env-vars
                key: VAULT_ADDR
        command:
          - /bin/sh
          - -c
          - "while true; do\n  sleep 10\n  VAULT_STATUS=$(vault status)\n  if echo \"$VAULT_STATUS\" | grep -q \"Initialized.*false\" && [ $HOSTNAME != 'sx-vault-0' ]; then\n    echo joining raft cluster\n    vault operator raft join http://sx-vault-0.sx-vault-internal:8200\n    sleep 5\n  fi \n  if echo \"$VAULT_STATUS\" | grep -q \"Initialized.*true\"; then\n    if echo \"$VAULT_STATUS\" | grep -q \"Sealed.*true\"; then\n      if [ -f /vault-root-token/unseal_key ]; then\n        vault operator unseal $(cat /vault-root-token/unseal_key)\n        sleep 5\n      else\n        echo unseal key not initialized yet  \n      fi\n    else  \n      echo vault already unsealed\n    fi\n  else  \n    echo Vault not initialized yet\n  fi\ndone\n"
        volumeMounts:
          - name: vault-root-token
            mountPath: /vault-root-token
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true
      - name: vault-initializer
        image: hashicorp/vault:1.17.2
        env:
          - name: VAULT_ADDR
            valueFrom:
              secretKeyRef:
                name: sx-vault-env-vars
                key: VAULT_ADDR
        command:
          - /bin/sh
          - -c
          - "while true; do\n  sleep 10\n  if [ -f /vault-root-token/root_token ]; then\n    export VAULT_TOKEN=$(cat /vault-root-token/root_token)\n    VAULT_STATUS=$(vault status)\n    if echo \"$VAULT_STATUS\" | grep -q \"Sealed.*false\"; then\n      if [ ! $(vault read identity/group/name/admins) ]; then\n\n        # kubernetes\n        vault auth enable kubernetes\n        #vault write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc:443 \n        vault write auth/kubernetes/config token_reviewer_jwt=\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\" kubernetes_host=\"https://$KUBERNETES_PORT_443_TCP_ADDR:443\" kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n\n        # crossplane\n        CROSSPLANETOKEN=$(vault token create -display-name=crossplane-token -policy=root -format=json | /usr/local/libexec/vault/jq -r .\"auth.client_token\")\n        /usr/local/libexec/vault/kubectl create secret generic crossplane-init -n vault --from-literal=credentials='{\"token\":\"'${CROSSPLANETOKEN}'\"}' \n        vault write auth/kubernetes/role/crossplane bound_service_account_names=\"*\" bound_service_account_namespaces=crossplane policies=crossplane ttl=24h        \n\n      else \n\n      # due to #405\n        if [ ! $(vault read auth/oidc/config) ]; then\n          vault auth enable oidc\n          vault write auth/oidc/config oidc_discovery_url=\"https://keycloak-127-0-0-1.nip.io/realms/sx-cnp-oss\" oidc_client_id=\"vault\" oidc_client_secret=\"demosecret\" default_role=\"default\" oidc_discovery_ca_pem=@/vault/userconfig/vault-ca/ca.crt\n        fi\n\n        # workaround due to #422\n        if [ ! $(vault list identity/group-alias/id) ]; then\n          echo vault admins group configured, just updating group aliases\n          vault list identity/group/name\n          acc=$(vault auth list -format=json | /usr/local/libexec/vault/jq -r '.[\"oidc/\"].accessor')\n          vault list identity/group/name |grep -A10 -- '----' |tail -n +2 | while read groupname ; do \n            id=$(vault read \"/identity/group/name/$groupname\" -format=json | /usr/local/libexec/vault/jq -r .\"data.id\") \n            vault write identity/group-alias name=\"$groupname\" mount_accessor=\"$acc\" canonical_id=\"$id\"\n          echo group-alias created\n          done\n        fi\n        # end #422\n        echo creating accessor configmap\n        accessor=$(vault auth list -detailed | grep kubernetes | awk '{print $3}')\n        if /usr/local/libexec/vault/kubectl get configmap kubeauth-accessor -n vault; then\n          /usr/local/libexec/vault/kubectl patch configmap kubeauth-accessor -n vault -p '{\"data\":{\"accessor\": \"'\"${accessor}\"'\"}}'\n        else  \n          /usr/local/libexec/vault/kubectl create configmap kubeauth-accessor -n vault --from-literal=accessor=${accessor}\n        fi  \n        echo setup complete \n      fi      \n    else\n      echo vault still sealed\n    fi    \n  else \n    echo root token not initialized yet    \n  fi    \ndone  \n"
        volumeMounts:
          - name: vault-root-token
            mountPath: /vault-root-token
          - name: plugins
            mountPath: /usr/local/libexec/vault
          - mountPath: /vault/userconfig/vault-ca
            name: vault-ca-cert
            readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true
    extraEnvironmentVars:
      VAULT_CACERT: /vault/userconfig/vault-ca/ca.crt
    volumes:
      - name: plugins
        emptyDir: {}
      - name: vault-root-token
        secret:
          secretName: vault-init
          optional: true
      - name: vault-ca-cert
        secret:
          defaultMode: 420
          secretName: ca-cert
    volumeMounts:
      - mountPath: /usr/local/libexec/vault
        name: plugins
        readOnly: false
      - mountPath: /vault/userconfig/vault-ca
        name: vault-ca-cert
        readOnly: true
    dataStorage:
      size: 1Gi
    auditStorage:
      enabled: true
      size: 1Gi
    affinity: null
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            # Enable unauthenticated metrics access (necessary for Prometheus Operator)
            telemetry {
              unauthenticated_metrics_access = "true"
            }
          }

          storage "raft" {
            path = "/vault/data"
          }

          # For integrated raft storage and security
          # https://developer.hashicorp.com/vault/docs/configuration#disable_mlock
          disable_mlock = true

          telemetry {
            prometheus_retention_time = "30m"
            disable_hostname = true
          }

          service_registration "kubernetes" {}
          plugin_directory = "/usr/local/libexec/vault"
  serverTelemetry:
    serviceMonitor:
      enabled: true
  prometheusRules:
    enabled: true
